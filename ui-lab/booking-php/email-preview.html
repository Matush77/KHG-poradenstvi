<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking e-mails</title>
<style>
:root{--paper:#FBF8F3;--ink:#163A55;--mute:#5E6E7C;--line:rgba(22,58,85,.14);--chip:#EDE7DE;--stage:#E9E4DC}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
header h1{margin:0 auto 0 0;font-size:17px;font-weight:600}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:none;font:inherit;color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 58px)}
nav{border-right:1px solid var(--line);padding:12px 8px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;color:var(--ink);padding:10px 12px;border-radius:12px;cursor:pointer}
nav button small{display:block;color:var(--mute);font-size:13px}
nav button[aria-current=true]{background:var(--chip)}
main{padding:20px 16px 48px;background:var(--stage);overflow:hidden}
.client{margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.06);overflow:hidden;transform-origin:top left}
/* OnePlus Nord 5 class: 6.83" 1272×2800 at ~3.1× = 412 CSS px wide, thin even bezels, centred punch-hole */
.client.phone{border:6px solid #111;border-radius:34px;position:relative}
.client.phone::before{content:'';display:block;height:30px;background:#fff}
.client.phone::after{content:'';position:absolute;top:9px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#111}
.statusbar{display:none}
.client.phone .statusbar{display:flex;justify-content:space-between;position:absolute;top:6px;left:18px;right:18px;font:600 12px/18px Roboto,system-ui,sans-serif;color:#111}
.client.tablet{border:12px solid #1d1d1f;border-radius:28px}
/* the screen is a fixed window that scrolls, like the real device: phone 412×906 (2800/1272 of the width,
   status strip included), tablet 768×1024; desktop shows the whole e-mail */
.screen{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.client.phone .screen{height:876px}
.client.tablet .screen{height:1024px}
.meta{padding:14px 18px;border-bottom:1px solid #eee;font-size:14px;color:#333}
.meta .subj{font-size:17px;font-weight:600;color:#111;margin-bottom:4px}
.meta .att{margin-top:6px;display:inline-block;background:#f1f1f1;border-radius:8px;padding:3px 10px;font-size:13px}
iframe{display:block;width:100%;border:0}
.client.dark .screen,.client.dark .meta{background:#1F1F1F;color:#E3E3E3}
.client.dark .meta *{color:inherit}
.scaler{margin:0 auto}
details{max-width:640px;margin:20px auto 0;background:#fff;border-radius:12px;padding:12px 16px}
details pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;margin:12px 0 0}
.when{max-width:640px;margin:0 auto 12px;color:var(--mute);text-align:center}
@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px}
  nav button{flex:0 0 auto;width:auto}
  nav button small{display:none}
}
</style>
</head>
<body>
<header>
  <h1>Booking e-mails</h1>
  <div class="seg" id="who" role="group" aria-label="Recipient">
    <button data-v="client" aria-pressed="true">Client</button>
    <button data-v="owner" aria-pressed="false">Kristýna</button>
  </div>
  <div class="seg" id="device" role="group" aria-label="Device">
    <button data-v="phone" aria-pressed="true">Phone (Nord 5)</button>
    <button data-v="tablet" aria-pressed="false">Tablet</button>
    <button data-v="desktop" aria-pressed="false">Desktop</button>
  </div>
  <div class="seg" id="forma" role="group" aria-label="Session type">
    <button data-v="online" aria-pressed="true">Online</button>
    <button data-v="osobne" aria-pressed="false">In person</button>
  </div>
  <div class="seg" id="theme" role="group" aria-label="Mail app theme">
    <button data-v="light" aria-pressed="true">Light</button>
    <button data-v="dark" aria-pressed="false">Dark</button>
  </div>
</header>
<div class="layout">
  <nav id="list"></nav>
  <main>
    <p class="when" id="when"></p>
    <div class="scaler" id="scaler">
      <div class="client" id="client">
        <div class="statusbar" aria-hidden="true"><span>13:50</span><span>5G ▮ 84 %</span></div>
        <div class="screen" id="screen">
        <div class="meta">
          <div class="subj" id="subj"></div>
          <div>From: <span id="from"></span></div>
          <div>To: <span id="to"></span></div>
          <span class="att" id="att" hidden>📎 sezeni.ics</span>
        </div>
        <iframe id="frame" title="E-mail"></iframe>
        </div>
      </div>
    </div>
    <details><summary>Plain-text version (shown by mail apps that block HTML)</summary><pre id="text"></pre></details>
  </main>
</div>

  });
}
seg($('who'), 'who');
seg($('device'), 'device');
seg($('forma'), 'forma');
seg($('theme'), 'theme');

function fit() {
  const f = $('frame');
  const doc = f.contentDocument; if (!doc || !doc.body) return;
  f.style.height = doc.documentElement.scrollHeight + 'px';
  const client = $('client'), scaler = $('scaler');
  const w = WIDTHS[state.device] + BEZEL[state.device];
  const avail = scaler.parentElement.clientWidth - 32;
  const s = Math.min(1, avail / w);
  client.style.width = w + 'px';
  client.style.transform = s < 1 ? `scale(${s})` : '';
  scaler.style.width = w * s + 'px';
  scaler.style.height = client.offsetHeight * s + 'px';
}

function render() {
  const mails = DATA.mails[state.who][state.forma];
  const m = mails.find(x => x.id === state.id) || mails[0];
  $('list').innerHTML = '';
  for (const x of mails) {
    const b = document.createElement('button');
    b.innerHTML = '<span></span><small></small>';
    b.firstChild.textContent = x.name;
    b.lastChild.textContent = x.when;
    b.setAttribute('aria-current', x.id === m.id);
    b.onclick = () => { state.id = x.id; render(); };
    $('list').append(b);
  }
  $('when').textContent = 'Sent: ' + m.when;
  $('subj').textContent = m.subject;
  $('to').textContent = m.to || 'jana.novakova@example.com';
  $('att').hidden = !m.ics;
  $('text').textContent = m.text;
  $('client').className = 'client ' + state.device + (state.theme === 'dark' ? ' dark' : '');
  $('client').style.width = (WIDTHS[state.device] + BEZEL[state.device]) + 'px';
  const f = $('frame');
  $('screen').scrollTop = 0;
  f.onload = () => { fit(); f.contentDocument.fonts.ready.then(fit); };
  f.srcdoc = state.theme === 'dark' ? m.html.replace('</head>', DARK + '</head>') : m.html;
}
addEventListener('resize', fit);
render();
</script>
</body>
</html>
