<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KHG rezervace ukázka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="only light">
<link rel="preload" href="/fonts/Inter/Inter-LatinExt-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Self-hosted fonts, same files as the site, with metric-matched fallbacks (no CDN, no reflow when they arrive) */
@font-face { font-family: Inter; src: url('/fonts/Inter/Inter-LatinExt-var.woff2') format('woff2'); font-weight: 300 700; font-display: swap; }
@font-face { font-family: Fraunces; src: url('/ui-lab/proposal/fonts/Fraunces-500-Soft-cs.woff2') format('woff2'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'Inter Fallback'; src: local('Arial'), local('ArialMT'); size-adjust: 106.44%; ascent-override: 91.01%; descent-override: 22.66%; line-gap-override: 0%; }
@font-face { font-family: 'Inter Fallback Android'; src: local('Roboto'), local('Roboto-Regular'); size-adjust: 107.27%; ascent-override: 90.31%; descent-override: 22.49%; line-gap-override: 0%; }
/* Layout: one short header line, then the calendar and the times get the space. Phone: stacked; desktop: calendar left, times right. */
:root {
  --paper: #FBF8F3;
  --card: #FFFFFF;
  --sky: #E8EFF4;
  --sky-deep: #DCE6EE;
  --peach: #F6E6DC;
  --peach-deep: #F2DBCC;
  --navy: #163A55;
  --blue: #2D5A7B;
  --slate: #44576A;
  --mute: #5E6E7C;
  --coral: #E8927C;
  --coral-ink: #B5573F;
  --line: rgba(22,58,85,.14);
  --on-coral: #163A55;
  --tint: var(--sky);
  --tint-deep: var(--sky-deep);
  --f-head: Fraunces, Georgia, "Noto Serif", serif;
  --f-body: Inter, "Inter Fallback", "Inter Fallback Android", system-ui, sans-serif;
}
/* light only, like the site (dark phones showed light header over a dark booking) */
:root { color-scheme: light; }
body.f-osobne { --tint: var(--peach); --tint-deep: var(--peach-deep); }

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--navy);
  font: 400 16px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
h1, h2 { font-family: var(--f-head); font-weight: 500; font-variation-settings: "SOFT" 100, "WONK" 0; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
button { font: inherit; color: inherit; }
/* phones flash a blue box on every tap; the buttons have their own pressed look, keyboard focus still shows the outline */
button, a, label { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 16px; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-head); font-weight: 500; font-size: 17px; font-variation-settings: "SOFT" 100; }
.brand svg { width: 22px; height: 22px; flex: none; }
.demo-note { font-size: 12px; color: var(--mute); }
/* real site header on top (rezervace/site-header.js) */
.site-header-host { display: block; height: 68px; }
.top .brand { display: none; }

/* Phones: no card, the booking sits straight on the page and gets the full width. Card from tablet up. */
.panel { display: grid; gap: 20px; scroll-margin-top: 84px; }
@media (min-width: 720px) { .panel { gap: 28px; padding-top: 16px; } } /* no card at any width (owner 13 Nov): cream page everywhere */

/* Header: title, one facts line, format switch */
.head { display: grid; gap: 12px; }
.head h1 { font-size: 26px; line-height: 1.2; }
.facts { margin: 0; color: var(--slate); font-size: 15px; }
.facts b { color: var(--navy); font-weight: 600; }
/* Format switch: six looks to compare, picked with ?sw=1..10, default 8 (owner pick 13 Nov) (class on <html>; see rezervace/prepinac.html). Default 1. */
.fmt-x, .fmt-s { display: none; }
.switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fmt { border: 0; background: none; cursor: pointer; color: var(--navy); font-size: 16px; transition: background .15s, color .15s, border-color .15s; }
.fmt-t { font-weight: 600; }
.fmt[aria-pressed="true"] { cursor: default; }
@media (min-width: 720px) { .switch { max-width: 360px; } .sw-2 .switch { max-width: 480px; } .sw-5 .switch { max-width: 420px; } }

/* 1 Pilulka: white track, the chosen one in its format tint (the morning look, track white so it shows on the page) */
.sw-1 .switch { gap: 4px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.sw-1 .fmt { border-radius: 999px; min-height: 48px; color: var(--slate); }
@media (hover: hover) { .sw-1 .fmt:hover:not([aria-pressed="true"]) { color: var(--navy); } }
.sw-1 .fmt[aria-pressed="true"][data-f="online"] { background: var(--sky); color: var(--navy); }
.sw-1 .fmt[aria-pressed="true"][data-f="osobne"] { background: var(--peach); color: var(--navy); }

/* 2 Karty: two tinted cards like Ceník (sky Online, peach Osobně v Ostravě), the chosen one with a navy ring and tick */
.sw-2 .fmt { position: relative; text-align: left; border-radius: 18px; padding: 14px 16px; min-height: 84px; display: grid; align-content: start; gap: 2px; border: 2px solid transparent; }
.sw-2 .fmt[data-f="online"] { background: var(--sky); } .sw-2 .fmt[data-f="osobne"] { background: var(--peach); }
@media (hover: hover) { .sw-2 .fmt[aria-pressed="false"]:hover[data-f="online"] { background: var(--sky-deep); } .sw-2 .fmt[aria-pressed="false"]:hover[data-f="osobne"] { background: var(--peach-deep); } }
.sw-2 .fmt-t { font-family: var(--f-head); font-weight: 500; font-size: 19px; line-height: 1.25; padding-right: 24px; }
.sw-2 .fmt-x { display: inline; }
.sw-2 .fmt-s { display: block; font-size: 13px; color: var(--slate); }
.sw-2 .fmt[aria-pressed="true"] { border-color: var(--navy); }
.sw-2 .fmt[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: var(--paper); font-size: 13px; font-weight: 600; display: grid; place-items: center; }
.sw-2 .facts-place { display: none; }

/* 3 Záložky: two Fraunces tabs on a hairline, the chosen one navy with a coral underline */
.sw-3 .switch { gap: 0; border-bottom: 1px solid var(--line); }
.sw-3 .fmt { min-height: 48px; margin-bottom: -1px; border-bottom: 3px solid transparent; color: var(--mute); font-family: var(--f-head); font-size: 19px; }
.sw-3 .fmt-t { font-weight: 500; }
@media (hover: hover) { .sw-3 .fmt:hover:not([aria-pressed="true"]) { color: var(--navy); } }
.sw-3 .fmt[aria-pressed="true"] { color: var(--navy); border-bottom-color: var(--coral); }

/* 4 Dvě tlačítka: separate pills; the chosen one in its tint with a navy ring, the other white with a hairline */
.sw-4 .fmt { border-radius: 999px; min-height: 48px; background: var(--card); border: 1.5px solid var(--line); color: var(--slate); }
@media (hover: hover) { .sw-4 .fmt:hover:not([aria-pressed="true"]) { color: var(--navy); border-color: var(--navy); } }
.sw-4 .fmt[aria-pressed="true"] { border: 2px solid var(--navy); color: var(--navy); }
.sw-4 .fmt[aria-pressed="true"][data-f="online"] { background: var(--sky); } .sw-4 .fmt[aria-pressed="true"][data-f="osobne"] { background: var(--peach); }

/* 5 Řádky: two rows with a round radio, the place under the name; the chosen row takes its tint */
.sw-5 .switch { grid-template-columns: 1fr; }
.sw-5 .fmt { display: grid; grid-template-columns: 22px 1fr; column-gap: 12px; align-items: center; text-align: left; padding: 12px 16px; min-height: 64px; border-radius: 16px; background: var(--card); border: 1.5px solid var(--line); }
.sw-5 .fmt::before { content: ""; grid-row: 1 / span 2; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--mute); box-sizing: border-box; }
.sw-5 .fmt-x { display: inline; }
.sw-5 .fmt-s { display: block; grid-column: 2; font-size: 14px; color: var(--slate); }
@media (hover: hover) { .sw-5 .fmt:hover:not([aria-pressed="true"]) { border-color: var(--navy); } }
.sw-5 .fmt[aria-pressed="true"] { background: var(--tint); border-color: transparent; }
.sw-5 .fmt[aria-pressed="true"]::before { border: 7px solid var(--navy); }
.sw-5 .facts-place { display: none; }

/* 6 Barevná dráha: the whole track takes the format tint, the chosen one is a white pill with a hairline */
.sw-6 .switch { gap: 4px; padding: 4px; border-radius: 999px; background: var(--tint); transition: background .2s; }
.sw-6 .fmt { border-radius: 999px; min-height: 48px; color: var(--slate); }
@media (hover: hover) { .sw-6 .fmt:hover:not([aria-pressed="true"]) { color: var(--navy); } }
.sw-6 .fmt[aria-pressed="true"] { background: var(--card); color: var(--navy); box-shadow: 0 0 0 1px var(--line); }

/* 7-10: stronger versions of 1 and 6 (owner: 1 too subtle, easy to miss which one is chosen).
   Unchosen label goes quieter (mute 500), chosen gets a second cue that is not only colour. */
:root { --sky-strong: #CFDEEA; --peach-strong: #F0D3C2; }
.sw-7 .fmt:not([aria-pressed="true"]), .sw-8 .fmt:not([aria-pressed="true"]), .sw-9 .fmt:not([aria-pressed="true"]), .sw-10 .fmt:not([aria-pressed="true"]) { color: var(--mute); }
.sw-7 .fmt:not([aria-pressed="true"]) .fmt-t, .sw-8 .fmt:not([aria-pressed="true"]) .fmt-t, .sw-9 .fmt:not([aria-pressed="true"]) .fmt-t, .sw-10 .fmt:not([aria-pressed="true"]) .fmt-t { font-weight: 500; }
@media (hover: hover) { .sw-7 .fmt:hover:not([aria-pressed="true"]), .sw-8 .fmt:hover:not([aria-pressed="true"]), .sw-9 .fmt:hover:not([aria-pressed="true"]), .sw-10 .fmt:hover:not([aria-pressed="true"]) { color: var(--navy); } }

/* 7 Pilulka + rámeček: as 1, the chosen side also has a navy ring */
.sw-7 .switch { gap: 4px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.sw-7 .fmt { border-radius: 999px; min-height: 48px; }
.sw-7 .fmt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--navy); }
.sw-7 .fmt[aria-pressed="true"][data-f="online"] { background: var(--sky); } .sw-7 .fmt[aria-pressed="true"][data-f="osobne"] { background: var(--peach); }

/* 8 Pilulka sytější: as 1, the chosen side in a deeper tint, the other side quiet */
.sw-8 .switch { gap: 4px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.sw-8 .fmt { border-radius: 999px; min-height: 48px; }
/* the coloured pill slides to the chosen side and changes tint on the way (transform only; off with reduced motion) */
.sw-8 .switch { position: relative; }
.sw-8 .switch::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 6px); border-radius: 999px; background: var(--sky-strong); transition: transform .3s cubic-bezier(.3,.7,.2,1), background-color .3s; }
.sw-8 .f-osobne .switch::before { transform: translateX(calc(100% + 4px)); background: var(--peach-strong); }
.sw-8 .fmt { position: relative; z-index: 1; background: none; }

/* 9 Dráha + rámeček: as 6, the white chosen pill has a navy ring */
.sw-9 .switch { gap: 4px; padding: 4px; border-radius: 999px; background: var(--tint); transition: background .2s; }
.sw-9 .fmt { border-radius: 999px; min-height: 48px; }
.sw-9 .fmt[aria-pressed="true"] { background: var(--card); box-shadow: inset 0 0 0 2px var(--navy); }

/* 10 Dráha sytější: as 6 on a deeper tint, so the white chosen pill stands out more */
.sw-10 .switch { gap: 4px; padding: 4px; border-radius: 999px; background: var(--sky-strong); transition: background .2s; }
.f-osobne .sw-10 .switch, html.sw-10 body.f-osobne .switch { background: var(--peach-strong); }
.sw-10 .fmt { border-radius: 999px; min-height: 48px; }
.sw-10 .fmt[aria-pressed="true"] { background: var(--card); box-shadow: 0 0 0 1px var(--line); }

/* Picker */
.cols { display: grid; gap: 24px; }
@media (min-width: 720px) { .cols { grid-template-columns: 340px 1fr; gap: 40px; } }
.cal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-top b { font-weight: 600; font-size: 17px; }
.nav { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; font-size: 22px; }
@media (hover: hover) { .nav:hover:not(:disabled) { background: var(--tint); } }
.nav:disabled { opacity: .25; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-variant-numeric: tabular-nums; }
.dow { font-size: 12px; color: var(--mute); padding-bottom: 2px; }
.day { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 50%; background: transparent; font-size: 16px; color: var(--mute); opacity: .45; display: grid; place-items: center; }
.day.free { background: var(--tint); color: var(--navy); opacity: 1; cursor: pointer; font-weight: 600; }
@media (hover: hover) { .day.free:hover { background: var(--tint-deep); } }
.day.sel { background: var(--navy); color: var(--paper); }
.day.out { visibility: hidden; }
/* month change by swipe on phones: the grid lets vertical scrolling through, the new month slides in from the swipe side */
.grid { touch-action: pan-y; }
/* the month sliding in must not make the page wider than the screen (it did by 24px; phones then shifted the whole page sideways) */
body { overflow-x: clip; }
.grid.in-next { animation: month-in-next .22s ease-out; }
.grid.in-prev { animation: month-in-prev .22s ease-out; }
@keyframes month-in-next { from { transform: translateX(24px); opacity: 0; } }
@keyframes month-in-prev { from { transform: translateX(-24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .grid.in-next, .grid.in-prev { animation: none; } }

.slots { display: grid; gap: 12px; align-content: start; }
/* phones: room for two rows of times is kept for every day, so a day with 2 times and a day with 6 do not resize the page */
@media (max-width: 719px) { .slots { min-height: 189px; scroll-margin: 84px 0 16px; } } /* scroll clear of the fixed header */
.slots h2 { font-size: 22px; }
.times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (min-width: 720px) { .times { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 860px) { .times { grid-template-columns: repeat(3, 1fr); } }
.time { min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; transition: background .15s, border-color .15s; }
@media (hover: hover) { .time:hover { background: var(--tint); border-color: transparent; } }
.time[aria-pressed="true"] { background: var(--navy); color: var(--paper); border-color: var(--navy); }
.slots-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tz { margin: 0; color: var(--mute); font-size: 13px; } /* online clients abroad: whose 14:00 it is */
.hint { margin: 0; color: var(--mute); font-size: 15px; }
.empty { background: var(--tint); border-radius: 16px; padding: 16px; font-size: 15px; color: var(--slate); display: grid; gap: 8px; }
.link { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: start; min-height: 32px; }

.btn { min-height: 56px; border: 0; border-radius: 999px; background: var(--coral); color: var(--on-coral); font-weight: 600; font-size: 18px; line-height: 1.2; letter-spacing: .005em; padding: 0 32px; cursor: pointer; width: 100%; }
@media (hover: hover) { .btn:hover { filter: brightness(1.04); } }
@media (min-width: 720px) { .btn { width: auto; } }
.cta { display: grid; gap: 8px; justify-items: start; }
.bk-terms { background: var(--peach); border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.45; color: var(--slate); }
.bk-terms p { margin: 0; font-size: inherit; line-height: inherit; } .bk-terms p + p { margin-top: 2px; }
.bk-terms b { color: var(--navy); font-weight: 600; }
.bk-terms a { color: var(--navy); text-decoration: underline; text-underline-offset: 2px; }
.cta small, .note { color: var(--mute); font-size: 13px; }

/* Step 2 + 3 */
.summary { background: var(--tint); border-radius: 16px; padding: 16px 18px; display: grid; gap: 2px; }
.summary b { font-weight: 600; font-size: 17px; }
.summary span { color: var(--slate); font-size: 15px; }
form { display: grid; gap: 16px; max-width: 520px; }
label { display: grid; gap: 6px; font-size: 14px; font-weight: 500; }
label em { font-style: normal; font-weight: 400; color: var(--mute); }
/* 16px: smaller makes iPhones zoom into the field on tap */
input, textarea { font: inherit; font-size: 16px; color: var(--navy); background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 48px; width: 100%; }
textarea { resize: vertical; line-height: 1.5; }

.names { display: grid; gap: 16px; } /* first and last name, side by side when there is room */
@media (min-width: 480px) { .names { grid-template-columns: 1fr 1fr; } }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; }
.err { color: var(--coral-ink); font-size: 13px; font-weight: 500; }
.err:empty { display: none; }
input[aria-invalid="true"] { border-color: var(--coral-ink); }
.check { grid-template-columns: 22px 1fr; align-items: start; font-weight: 400; color: var(--slate); }
.check input { min-height: 0; width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--navy); }
.pay { font-size: 13px; color: var(--mute); }
.done { display: grid; gap: 16px; max-width: 560px; }
.done p { margin: 0; color: var(--slate); }
.step { display: grid; gap: 20px; }

/* Lab: payment inside the page (?pay=1|2|3). A mockup of Stripe's fields, nothing is loaded from Stripe or charged.
   pay=1 card fields in the details form, pay=2 their own step after the details, pay=3 Stripe's own embedded form. */
.paybox { display: grid; gap: 14px; }
.paybox h2 { font-size: 21px; }
.wallet { min-height: 56px; border: 0; border-radius: 999px; background: #000; color: #fff; font-weight: 600; font-size: 18px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--mute); font-size: 14px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.cardf { position: relative; }
.cardf input { padding-right: 104px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.brands { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; pointer-events: none; }
.brands i { font: 700 10px/1 var(--f-body); font-style: normal; padding: 5px 5px; border-radius: 4px; background: var(--card); border: 1px solid var(--line); color: var(--navy); }
.cardrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.secure { color: var(--mute); font-size: 13px; display: flex; gap: 6px; align-items: flex-start; }
.secure svg { flex: none; margin-top: 2px; }
.summary.mini { padding: 12px 16px; }
.summary.mini b { font-size: 16px; }
.btn[aria-busy="true"] { opacity: .75; cursor: progress; }
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; margin-right: 10px; vertical-align: -2px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.bank { position: fixed; inset: 0; background: rgba(22,58,85,.45); display: grid; place-items: end center; z-index: 50; padding: 16px; animation: fade .2s; }
.bank div { background: var(--card); border-radius: 24px; padding: 24px; max-width: 420px; width: 100%; display: grid; gap: 10px; text-align: center; box-shadow: 0 16px 48px rgba(22,58,85,.2); }
.bank b { font-size: 18px; }
.bank p { color: var(--slate); font-size: 15px; }
@media (min-width: 720px) { .bank { place-items: center; } }
@keyframes fade { from { opacity: 0; } }
/* pay=3: how Stripe's own embedded form looks inside the page (its fonts and colours, not ours) */
.stripe { background: #fff; border: 1px solid #e3e8ee; border-radius: 12px; padding: 20px 16px; display: grid; gap: 14px; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #30313d; }
.stripe .link-btn { min-height: 48px; border-radius: 6px; background: #00d66f; color: #011e0f; font-weight: 600; display: grid; place-items: center; font-size: 16px; }
.stripe .s-or { display: flex; gap: 12px; align-items: center; color: #6d6e78; font-size: 13px; font-weight: 600; }
.stripe .s-or::before, .stripe .s-or::after { content: ""; flex: 1; height: 1px; background: #e3e8ee; }
.stripe h3 { font: 600 16px/1.3 inherit; font-family: inherit; letter-spacing: 0; }
.stripe label { font-size: 14px; font-weight: 400; color: #30313d; gap: 6px; }
.stripe .s-in { border: 1px solid #e0e0e0; border-radius: 6px; min-height: 44px; padding: 10px 12px; color: #8a8b94; font-size: 16px; box-shadow: 0 1px 1px rgba(0,0,0,.03); background: #fff; }
.stripe .s-split { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden; }
.stripe .s-split .s-in { border: 0; border-radius: 0; box-shadow: none; }
.stripe .s-split .s-in + .s-in { border-left: 1px solid #e0e0e0; }
.stripe .s-split .s-in:first-child { grid-column: 1 / -1; border-bottom: 1px solid #e0e0e0; border-left: 0; }
.stripe .s-pay { min-height: 48px; border: 0; border-radius: 6px; background: #0570de; color: #fff; font: 600 16px/1 inherit; font-family: inherit; cursor: pointer; }

              4: { side: 'čas v Česku' }, 5: { facts: 'čas v Česku' }, 6: { side: 'pražský čas' } })[new URLSearchParams(location.search).get('tz')] || { under: 'Časové pásmo: Praha' }; // owner pick 13 Nov

      '<div class="grid">' + cells.concat(pad(cells.length)).join('') + '</div></div>' +

  function field(id, label, type, ac, required, value, ph) {

    if (first) first.focus();
    return !first;
  }
  function clearOnInput(form) {
    form.addEventListener('input', function (ev) {
      var el = ev.target, err = document.getElementById(el.id + '-err');
      if (err && err.textContent) { err.textContent = ''; el.setAttribute('aria-invalid', 'false'); }
    });
  }
  // mock of the payment: busy button, then (card only) the bank's confirmation, then the confirmation step
  function pay(btn, bank) {
    if (btn.getAttribute('aria-busy') === 'true') return; // no double payment
    btn.setAttribute('aria-busy', 'true'); btn.disabled = true;
    btn.innerHTML = '<span class="spin" aria-hidden="true"></span>Probíhá platba…';
    say('Probíhá platba');
    setTimeout(function () {
      if (!bank) { state.step = 3; render(); toTop(); return; }
      var sheet = document.createElement('div'); sheet.className = 'bank'; sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-label', 'Potvrzení v bance');
      sheet.innerHTML = '<div><b>Potvrďte platbu v aplikaci své banky</b><p>Ukázka: takhle to vypadá, když banka chce potvrzení (3D Secure). Pokračuje to samo.</p></div>';
      document.body.appendChild(sheet);
      setTimeout(function () { sheet.remove(); state.step = 3; render(); toTop(); }, 2200);
    }, 900);
  }

  function renderStep2() {
    var online = state.f === 'online';
    var contact = online
      ? field('e', 'E-mail', 'email', 'email', true, 'jana.novakova@example.cz', '')
      : field('p', 'Telefon', 'tel', 'tel', true, '+420 777 123 456', '+420') +
        (PAY === 1 || PAY === 2 ? field('e', 'E-mail pro potvrzení a účtenku', 'email', 'email', false, '', '') : ''); // without Stripe's page nobody else asks for it
    // owner, 15 Nov: like Terapie.cz, a short optional message, not an intake form; the cancellation rule before paying
    var reason = '<label for="r"><span>S čím přicházíte <em>(nepovinné)</em></span><textarea id="r" rows="2" maxlength="500"></textarea></label>';
    var terms = '<div class="bk-terms"><p><b>Přesunout nebo zdarma zrušit lze nejpozději 36 hodin předem.</b></p>' +
      '<p>Zpracování údajů podle <a href="/ochrana-osobnich-udaju.html">zásad ochrany osobních údajů</a>.</p></div>';
    view.innerHTML = '<div class="step">' +
      '<button class="link" id="back">‹ Změnit termín</button>' + summary() +
      '<form id="f" novalidate>' +
      '<div class="names">' + field('fn', 'Jméno', 'text', 'given-name', true, 'Jana', '') + field('ln', 'Příjmení', 'text', 'family-name', true, 'Nováková', '') + '</div>' +
      contact + reason +
      (PAY === 1 ? cardFields() : '') + terms +
      '<div class="cta"><button class="btn" type="submit" id="go">' + (PAY >= 2 ? 'Pokračovat k platbě' : 'Zaplatit 1 100 Kč') + '</button></div>' +
      '<p class="err" id="go-err" role="alert"></p>' +
      '</form></div>';
    if (PAY === 1) wireCard();
    // back from Stripe's page: what the client typed comes back (kept for this tab only, removed once paid)
    try { var kept = JSON.parse(sessionStorage.getItem('khg-form') || 'null'); } catch (x) { kept = null; }
    if (kept) Object.keys(kept).forEach(function (id) { var el = document.getElementById(id); if (el && kept[id]) el.value = kept[id]; });
    // same as the phone's back button when the details were opened from the calendar
    document.getElementById('back').onclick = function () { if (history.state && history.state.pushed) history.back(); else { state.step = 1; render(); } };
    // an error goes away as soon as the field is being fixed, it is checked again on submit
    document.getElementById('f').addEventListener('input', function (ev) {
      var el = ev.target, err = document.getElementById(el.id + '-err');
      if (err && err.textContent) { err.textContent = ''; el.setAttribute('aria-invalid', 'false'); }
    });
    document.getElementById('f').onsubmit = function (ev) {
      ev.preventDefault();
      var checks = {
        fn: function (v) { return v ? '' : 'Vyplňte prosím jméno.'; },
        ln: function (v) { return v ? '' : 'Vyplňte prosím příjmení.'; },
        e: function (v, req) { return !v ? (req ? 'Vyplňte prosím e-mail, přijde na něj odkaz na videohovor.' : '') : (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? '' : 'E-mail nevypadá správně.'); },
        p: function (v, req) { return !v ? (req ? 'Vyplňte prosím telefon.' : '') : (v.replace(/\D/g, '').length >= 9 ? '' : 'Telefon nevypadá správně.'); }
      };
      var first = null;
      Object.keys(checks).forEach(function (id) {
        var el = document.getElementById(id); if (!el) return;
        var msg = checks[id](el.value.trim(), el.required);
        el.setAttribute('aria-invalid', msg ? 'true' : 'false');
        document.getElementById(id + '-err').textContent = msg;
        if (msg && !first) first = el;
      });
      if (first) { first.focus(); return; }
      if (PAY === 1 && !check(CARD_CHECKS)) return;
      var e = document.getElementById('e');
      state.email = e ? e.value.trim() : '';
      state.phone = online ? '' : document.getElementById('p').value.trim();
      state.name = document.getElementById('fn').value.trim() + ' ' + document.getElementById('ln').value.trim();
      state.note = document.getElementById('r').value.trim(); // only to the therapist's e-mail, never to Stripe or the calendar
      if (STRIPE && PAY === 0) {
        var keep = {}; ['fn', 'ln', 'e', 'p', 'r'].forEach(function (id) { var el = document.getElementById(id); if (el) keep[id] = el.value; });
        try { sessionStorage.setItem('khg-form', JSON.stringify(keep)); } catch (x) {}
        toCheckout(document.getElementById('go')); return;
      }
      if (PAY === 1) { pay(document.getElementById('go'), true); return; }
      state.step = PAY >= 2 ? 4 : 3; render(); toTop();
    };
  }

  /* Lab, real Stripe TEST payments (?stripe=1, only with ui-lab/stripe-demo/server.py on port 8810):
     pay=0 redirect to Stripe Checkout, pay=3 Checkout embedded in the page, pay=2 Payment Element in our design.
     Stripe.js is loaded only when the payment is shown, never with the calendar. */
  var STRIPE = new URLSearchParams(location.search).get('stripe') === '1';
  var stripeP = null, embedded = null;
  function loadStripe() {
    if (!stripeP) stripeP = Promise.all([
      fetch('/api/config').then(function (r) { return r.json(); }),
      new Promise(function (ok, fail) { var s = document.createElement('script'); s.src = 'https://js.stripe.com/v3/'; s.onload = ok; s.onerror = fail; document.head.appendChild(s); })
    ]).then(function (a) { return Stripe(a[0].pk, { locale: 'cs' }); });
    return stripeP;
  }
  function api(path, extra) {
    var b = { f: state.f, date: key(state.date), time: state.time, name: state.name || '', email: state.email || '', phone: state.phone || '', note: state.note || '', pay: PAY };
    for (var k in extra) b[k] = extra[k];
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Chyba ' + r.status); return j; }); });
  }
  function busy(btn, on, text) {
    if (!btn) return;
    btn.disabled = on; btn.setAttribute('aria-busy', on ? 'true' : 'false');
    btn.innerHTML = on ? '<span class="spin" aria-hidden="true"></span>' + text : text;
  }
  function payError(msg) {
    var el = document.getElementById('pay-err'); if (el) { el.textContent = msg; say(msg); }
  }
  // pay=0: our details, then off to Stripe's own page; it comes back with ?paid=cs_...
  function toCheckout(btn) {
    busy(btn, true, 'Přesměrování na platbu…');
    api('/api/checkout', { mode: 'redirect' }).then(function (j) { try { sessionStorage.setItem('khg-pay', '1'); } catch (x) {} location.href = j.url; })
      .catch(function (e) {
        // the server's message is written for the client (e.g. someone else is paying for this time right now)
        busy(btn, false, 'Zaplatit 1 100 Kč');
        loadSlots().catch(function () {});
        var out = document.getElementById('go-err');
        if (out) out.textContent = e.message; else alert(e.message);
      });
  }
  var APPEARANCE = {
    theme: 'stripe',
    variables: { colorPrimary: '#163A55', colorText: '#163A55', colorTextSecondary: '#44576A', colorDanger: '#B5573F', colorBackground: '#FFFFFF',
      fontFamily: 'Inter, system-ui, sans-serif', fontSizeBase: '16px', borderRadius: '12px', spacingUnit: '4px', focusBoxShadow: '0 0 0 3px rgba(45,90,123,.35)' },
    rules: { '.Input': { border: '1.5px solid rgba(22,58,85,.14)', boxShadow: 'none', padding: '12px 14px' },
      '.Input:focus': { borderColor: '#2D5A7B' }, '.Label': { fontSize: '14px', fontWeight: '500', marginBottom: '6px' },
      '.Tab': { border: '1.5px solid rgba(22,58,85,.14)', boxShadow: 'none' }, '.Tab--selected': { borderColor: '#163A55', boxShadow: 'none' } }
  };
  function renderRealPay(head) {
    if (PAY === 3) {
      view.innerHTML = head + '<div id="checkout" style="min-height:640px"></div><p class="err" id="pay-err" role="alert"></p></div>';
      loadStripe().then(function (stripe) {
        return api('/api/checkout', { mode: 'embedded' }).then(function (j) {
          return stripe.initEmbeddedCheckout({ fetchClientSecret: function () { return Promise.resolve(j.clientSecret); } });
        });
      }).then(function (c) { if (state.step !== 4) { c.destroy(); return; } embedded = c; c.mount('#checkout'); })
        .catch(function (e) { payError('Platbu se nepodařilo načíst: ' + e.message); });
    } else {
      view.innerHTML = head + '<form id="pf" novalidate class="paybox"><div id="pe" style="min-height:260px"></div>' +
        '<p class="err" id="pay-err" role="alert"></p>' +
        '<div class="cta"><button class="btn" type="submit" id="go" disabled>Zaplatit 1 100 Kč</button></div>' +
        '<p class="secure">' + LOCK + '<span>Platbu zpracovává Stripe. Údaje o kartě ke mně nechodí.</span></p></form></div>';
      var go = document.getElementById('go'), elements, ret;
      loadStripe().then(function (stripe) {
        return api('/api/intent').then(function (j) {
          ret = j.returnUrl;
          elements = stripe.elements({ clientSecret: j.clientSecret, appearance: APPEARANCE, locale: 'cs',
            fonts: [{ family: 'Inter', src: 'url(' + location.origin + '/fonts/Inter/Inter-LatinExt-var.woff2)', weight: '400 700' }] });
          var pe = elements.create('payment', { layout: 'tabs', defaultValues: { billingDetails: { name: state.name, email: state.email } } });
          pe.mount('#pe');
          pe.on('ready', function () { go.disabled = false; });
          document.getElementById('pf').onsubmit = function (ev) {
            ev.preventDefault(); if (go.disabled) return;
            payError(''); busy(go, true, 'Probíhá platba…');
            stripe.confirmPayment({ elements: elements, redirect: 'if_required', confirmParams: { return_url: ret } }).then(function (r) {
              if (r.error) { busy(go, false, 'Zaplatit 1 100 Kč'); payError(r.error.message); return; }
              if (r.paymentIntent && r.paymentIntent.status === 'succeeded') { state.step = 3; render(); toTop(); }
              else { busy(go, false, 'Zaplatit 1 100 Kč'); payError('Platba zatím neprošla (' + r.paymentIntent.status + ').'); }
            });
          };
        });
      }).catch(function (e) { payError('Platbu se nepodařilo načíst: ' + e.message); });
    }
  }

  /* Lab: the payment as its own step after the details (pay=2 our fields, pay=3 Stripe's embedded form) */
  function renderPay() {
    if (STRIPE) {
      renderRealPay('<div class="step"><button class="link" id="back">‹ Upravit údaje</button>' + summary().replace('class="summary"', 'class="summary mini"'));
      document.getElementById('back').onclick = function () { if (history.state && history.state.pushed) history.back(); else { state.step = 2; render(); } };
      return;
    }
    var head = '<div class="step"><button class="link" id="back">‹ Upravit údaje</button>' + summary().replace('class="summary"', 'class="summary mini"');
    if (PAY === 2) {
      view.innerHTML = head + '<form id="pf" novalidate class="paybox">' + cardFields().replace('<div class="paybox"><h2>Platba</h2>', '').replace(/<\/div>$/, '') +
        '<div class="cta"><button class="btn" type="submit" id="go">Zaplatit 1 100 Kč</button></div></form></div>';
      wireCard(); clearOnInput(document.getElementById('pf'));
      document.getElementById('pf').onsubmit = function (ev) { ev.preventDefault(); if (check(CARD_CHECKS)) pay(document.getElementById('go'), true); };
    } else {
      view.innerHTML = head + '<div class="stripe" aria-label="Platební formulář Stripe (ukázka)">' +
        '<div class="link-btn">Plaťte bezpečně pomocí ›link</div><div class="s-or">NEBO</div>' +
        '<h3>Kontakt</h3><label>E-mail<div class="s-in">' + (state.email || 'vy@example.com') + '</div></label>' +
        '<h3>Způsob platby</h3><div class="s-split"><div class="s-in">Číslo karty</div><div class="s-in">MM / RR</div><div class="s-in">Bezpečnostní kód</div></div>' +
        '<label>Jméno na kartě<div class="s-in">Jméno a příjmení</div></label><label>Země<div class="s-in" style="color:#30313d">Česko</div></label>' +
        '<button class="s-pay" id="go">Zaplatit</button><p class="s-foot">Využívá technologii <b>stripe</b> · Podmínky · Soukromí</p></div></div>';
      document.getElementById('go').onclick = function () { pay(this, true); };
    }
    document.getElementById('back').onclick = function () { if (history.state && history.state.pushed) history.back(); else { state.step = 2; render(); } };
  }

  function renderStep3() {
    // the e-mail and phone come back from the payment: never put them into the page as HTML
    var esc = function (v) { return String(v || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var sent = state.email ? 'Potvrzení přišlo na ' + esc(state.email) + '. ' : 'Termín máte zapsaný na telefon ' + esc(state.phone) + '. ';
    view.innerHTML = '<div class="done"><h2>Termín je rezervovaný</h2>' + summary() +
      '<p>' + sent + FORMATS[state.f].after + '</p>' +
      (state.meet ? '<p class="note">Demo: událost s Meet odkazem je v kalendáři „KHG test rezervace“: <a href="' + esc(state.meet) + '" target="_blank" rel="noopener">' + esc(state.meet.replace('https://', '')) + '</a></p>' : '') +
      '<p>Přesunout nebo zdarma zrušit lze nejpozději 36 hodin před sezením, celá částka bude vrácena.</p>' +
      (state.cancel ? '<p class="note">Demo: <a href="' + state.cancel.replace('/ui-lab/rezervace/zruseni.html', '/api/email') + '" target="_blank" rel="noopener">potvrzovací e-mail</a> · <a href="' + state.cancel + '">odkaz na zrušení z e-mailu</a></p>' : '') +
      '<div><button class="btn" id="again">Zpět na kalendář</button></div></div>';
    document.getElementById('again').onclick = function () {
      state.step = 1; state.time = null;
      if (STRIPE) loadSlots().then(function () { if (state.date && !slotsFor(state.date).length) state.date = null; render(); }, render); else render();
    };
  }

  /* Browser history: the details step is its own entry, so the phone's back button returns to the calendar
     instead of leaving the page. Format, day, time and step are kept in the address, so a refresh keeps the choice. */
  var shownStep = null, fromHistory = false;
  function syncUrl() {
    var u = new URL(location.href), p = u.searchParams;
    if (state.f === 'osobne') p.set('forma', 'osobne'); else p.delete('forma');
    if (state.date) p.set('den', key(state.date)); else p.delete('den');
    if (state.time) p.set('cas', state.time); else p.delete('cas');
    if (state.step === 2 || state.step === 4) p.set('krok', state.step === 4 ? 'platba' : '2'); else p.delete('krok'); // a refresh on the payment returns to the details
    ['step', 'paid', 'pi', 'payment_intent', 'payment_intent_client_secret', 'redirect_status'].forEach(function (k) { p.delete(k); });
    var entry = { step: state.step };
    if (!fromHistory && ((state.step === 2 && shownStep === 1) || (state.step === 4 && shownStep === 2))) { entry.pushed = true; history.pushState(entry, '', u); }
    else if (history.state && history.state.pushed && (state.step === 2 || state.step === 4)) { entry.pushed = true; history.replaceState(entry, '', u); }
    else history.replaceState(entry, '', u);
    shownStep = state.step; fromHistory = false;
  }
  function readUrl() {
    var p = new URLSearchParams(location.search);
    state.f = p.get('forma') === 'osobne' ? 'osobne' : 'online';
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(p.get('den') || ''), d = m && new Date(+m[1], m[2] - 1, +m[3]);
    var slots = d ? slotsFor(d) : [];
    state.date = slots.length ? d : null;
    state.time = state.date && slots.indexOf(p.get('cas')) >= 0 ? p.get('cas') : null;
    state.step = state.time && /^(2|platba)$/.test(p.get('krok')) ? 2 : 1; // the confirmation is never restored from an address
    var show = state.date || firstFree(TODAY);
    if (show) state.month = new Date(show.getFullYear(), show.getMonth(), 1);
  }
  window.addEventListener('popstate', function () { fromHistory = true; readUrl(); render(); });

  function render() {
    if (embedded) { embedded.destroy(); embedded = null; } // Stripe allows one embedded Checkout at a time
    renderHead();
    document.querySelector('.switch').hidden = state.step !== 1;
    document.getElementById('facts').hidden = state.step !== 1;
    document.getElementById('title').hidden = state.step === 3;
    if (state.step === 1) renderStep1(); else if (state.step === 2) renderStep2(); else if (state.step === 4) renderPay(); else renderStep3();
    syncUrl();
  }

  document.querySelectorAll('.fmt').forEach(function (b) {
    b.onclick = function () {
      state.f = b.dataset.f; state.time = null;
      if (state.date && !slotsFor(state.date).length) state.date = null; // the day is not free in this format: nothing chosen
      if (!state.date && !hasFree(state.month)) { var f = firstFree(TODAY); if (f) state.month = new Date(f.getFullYear(), f.getMonth(), 1); }
      render();
    };
  });

  /* Back from Stripe's page without paying (its back arrow, or the phone's back button): end that Stripe page,
     so the time is free for everyone at once, not after Stripe's 30 minutes. What the client typed stays. */
  function releaseHeld() {
    var was; try { was = sessionStorage.getItem('khg-pay'); sessionStorage.removeItem('khg-pay'); } catch (x) {}
    if (!was) return Promise.resolve();
    return fetch('/api/release', { method: 'POST', keepalive: true }).catch(function () {});
  }

  /* Real free times from the booking back end (lab ?stripe=1: ui-lab/booking-php, the owner's hours calendars). */
  function loadSlots() {
    return fetch('/api/slots', { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Chyba ' + r.status); return j; }); })
      .then(function (j) {
        AV = { online: j.online, osobne: j.osobne };
        var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(j.to);
        LAST = new Date(+m[1], m[2] - 1, +m[3]);
      });
  }

  function start() {
    var first = firstFree(TODAY);
    readUrl(); // a refresh or a shared link restores format, day, time and step; otherwise the first free month, no day chosen
    // lab: open straight on step 2 or 3 (?step=2|3) for the comparisons
    var st = +new URLSearchParams(location.search).get('step');
    if (st === 4 && PAY < 2) st = 2;
    // firstFree after readUrl, so it is the first free day of the format in the address
    if (st >= 2 && st <= 4) { state.date = firstFree(TODAY); state.time = slotsFor(state.date)[0]; state.step = st; state.email = 'jana.novakova@example.cz'; }
    // back from Stripe (redirect, embedded return or a bank check): ask the demo server whether it was paid
    var qs = new URLSearchParams(location.search), back = qs.get('paid') || qs.get('payment_intent');
    if (STRIPE && back) {
      fetch((qs.get('paid') ? '/api/checkout?id=' : '/api/intent?id=') + encodeURIComponent(back)).then(function (r) { return r.json(); }).then(function (j) {
        var m = j.meta || {}, md = /^(\d{4})-(\d{2})-(\d{2})$/.exec(m.den || '');
        // paid: the time comes from the payment, not the free times (it is taken now, by this very booking)
        if (j.paid && md && m.cas) {
          state.f = m.forma === 'osobne' ? 'osobne' : 'online';
          state.date = new Date(+md[1], md[2] - 1, +md[3]); state.time = m.cas;
          state.month = new Date(state.date.getFullYear(), state.date.getMonth(), 1);
        }
        if (m.den && state.time) { state.email = m.email || j.email || ''; state.phone = m.telefon; state.name = m.jmeno; }
        state.meet = j.meet || ''; // demo only: the real page never shows the link, it goes by e-mail
        state.payId = j.id || '';
        state.cancel = j.cancel || '';
        if (j.paid) try { sessionStorage.removeItem('khg-form'); } catch (x) {}
        state.step = j.paid && state.time ? 3 : (state.time ? 2 : 1);
        render();
        if (!j.paid) say('Platba neproběhla, můžete to zkusit znovu.');
      });
    } else render();
  }

  if (STRIPE) {
    // today, not the 13 Nov snapshot; the calendar is drawn at once (same size) and filled when the times arrive
    TODAY = new Date(); TODAY.setHours(0, 0, 0, 0); FIRST = new Date(TODAY);
    state.month = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    state.f = new URLSearchParams(location.search).get('forma') === 'osobne' ? 'osobne' : 'online';
    LOADING = 'Načítám volné termíny…';
    renderHead(); renderStep1();
    if (new URLSearchParams(location.search).get('paid')) { try { sessionStorage.removeItem('khg-pay'); } catch (x) {} }
    var released = releaseHeld();
    // the phone's back button may restore this page from memory: free the time and redraw (the pay button was left spinning)
    addEventListener('pageshow', function (e) {
      if (!e.persisted) return;
      releaseHeld().then(loadSlots).then(render, render);
    });
    released.then(loadSlots).then(function () { LOADING = ''; start(); }, function () {
      LOADING = 'Volné termíny se teď nepodařilo načíst. Stačí to zkusit za chvíli, nebo zavolat na <a href="tel:+420605990980">605&nbsp;990&nbsp;980</a>.';
      renderStep1();
    });
  } else start();
})();
</script>
