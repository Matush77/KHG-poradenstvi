<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#E8F8F5"/>
  
  <!-- Medical cross in circle -->
  <circle cx="100" cy="100" r="45" fill="#55EFC4" opacity="0.3"/>
  <rect x="90" y="70" width="20" height="60" rx="3" fill="#00B894"/>
  <rect x="70" y="90" width="60" height="20" rx="3" fill="#00B894"/>
  
  <!-- Apple (health symbol) -->
  <ellipse cx="100" cy="100" r="25" ry="30" fill="#00B894" opacity="0"/>
  
  <!-- Plus signs around -->
  <text x="60" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00B894" opacity="0.5">+</text>
  <text x="130" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00B894" opacity="0.5">+</text>
  <text x="60" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00B894" opacity="0.5">+</text>
  <text x="130" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00B894" opacity="0.5">+</text>
</svg>
