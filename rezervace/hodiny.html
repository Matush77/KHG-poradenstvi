<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hodiny · KHG Poradenství</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="only light">
<meta name="apple-mobile-web-app-title" content="Hodiny">
<style>
/* Kristýna's hours page, rebuilt 16 Nov around her day (the month with two hour grids was confusing):
   - a week strip that counts sessions, the month one tap away;
   - one day = one list of hours: each hour shows the client coming, or two switches, Online and Osobně;
   - a session is handled right here: Přesunout to any whole hour 7:00-20:00 (outside her hours too, like a drag in
     Google Calendar), Zrušit opens its own page with the refund choice;
   - "Běžný týden" (the hours every week starts from) is the same list for Po ... Ne.
   Taps are a draft until "Uložit" (owner, 14 Nov). Hours live in the booking database (booking/src/hours.php);
   the page needs the shared password once per device (src/owner.php). The device's own font, no web fonts. */
:root {
  --paper: #FFFFFF; --sky: #E8EFF4; --sky-on: #CFE2F1; --peach: #F6E6DC; --peach-on: #F4D3C4; --navy: #163A55; --blue: #2D5A7B;
  --slate: #44576A; --mute: #5E6E7C; --coral: #E8927C; --coral-ink: #B5573F; --line: rgba(22,58,85,.14); --soft: #F2F4F6;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--navy); font: 400 16px/1.5 var(--f-body);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 110px max(16px, env(safe-area-inset-left, 0px)); }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
a { color: var(--blue); text-underline-offset: 3px; }
.wrap { max-width: 640px; margin: 0 auto; }

/* top: title, month with arrows, the week strip (the month grid opens under the month name) */
.top { padding: 14px 0 10px; display: grid; gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
.mon { display: flex; align-items: center; gap: 4px; }
h1 { white-space: nowrap; }
@media (max-width: 370px) { h1 { font-size: 20px; } .monbtn { min-width: 0; font-size: 15px; } }
.nav { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; font-size: 20px; line-height: 1; padding: 0; flex: none; }
.nav:disabled { opacity: .35; cursor: default; }
.monbtn { border: 0; background: none; padding: 0 2px; min-height: 40px; min-width: 104px; font-weight: 600; font-size: 16px;
  text-decoration: underline; text-decoration-color: var(--line); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.back { border: 0; background: none; padding: 0; min-height: 40px; font-weight: 600; font-size: 15px; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
.strip[hidden], .month[hidden] { display: none; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wday { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 6px 0 5px; display: grid; justify-items: center; gap: 1px;
  min-height: 66px; font-variant-numeric: tabular-nums; position: relative; }
.wday small { font-size: 12px; color: var(--mute); line-height: 16px; }
.wday b { font-size: 17px; font-weight: 600; line-height: 22px; }
.wday i { font-style: normal; font-size: 11px; line-height: 16px; min-height: 16px; color: var(--mute); }
.wday i.n { color: #fff; background: var(--navy); border-radius: 999px; padding: 0 7px; font-weight: 600; }
.wday.closed { background: var(--soft); border-color: transparent; }
.wday.closed b { color: var(--mute); }
.wday.today b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.wday:disabled { opacity: .35; cursor: default; }
.wday[aria-pressed="true"] { border: 2px solid var(--navy); box-shadow: 0 0 0 1px var(--navy) inset; }
.wday.pend::after, .md.pend::after { content: ''; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); }
.month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.month .wd { text-align: center; font-size: 12px; color: var(--mute); }
.md { height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; font-variant-numeric: tabular-nums; font-weight: 600; position: relative; padding: 0; }
.md.closed { background: var(--soft); border-color: transparent; color: var(--mute); font-weight: 500; }
.md:disabled { opacity: .35; cursor: default; background: none; border-color: transparent; }
.md[aria-pressed="true"] { border: 2px solid var(--navy); }
.md .dot { position: absolute; left: 50%; bottom: 4px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--navy); }
.md i { display: none; }
.monbtn:disabled { color: inherit; cursor: default; text-decoration: none; }
/* a computer (owner, 16 Nov: "more information visible"): the month stays open on the left, the day on the right;
   each day of the month shows its sessions or its free hours */
@media (min-width: 900px) {
  .wrap { max-width: 1040px; display: grid; grid-template-columns: 400px minmax(0, 1fr); column-gap: 40px;
    grid-template-areas: "top list" "top foot"; align-items: start; }
  .top { grid-area: top; position: sticky; top: 0; padding-top: 20px; }
  #list { grid-area: list; padding-top: 10px; }
  .foot { grid-area: foot; }
  #list .dhead { border-top: 0; padding-top: 14px; }
  .month { gap: 5px; }
  .md { height: 62px; display: grid; justify-items: center; align-content: center; gap: 3px; }
  .md b { font-size: 16px; line-height: 20px; }
  .md .dot { display: none; }
  .md i { display: block; font-style: normal; font-size: 11px; line-height: 16px; min-height: 16px; color: var(--mute); font-weight: 500; }
  .md i.n { color: #fff; background: var(--navy); border-radius: 999px; padding: 0 7px; font-weight: 600; }
  .md.today b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .md[aria-pressed="true"] { box-shadow: 0 0 0 1px var(--navy) inset; }
  .skel:first-child { margin-top: 24px; }
}

/* the day */
.dhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; padding: 14px 0 8px; border-top: 1px solid var(--line); }
.dhead h2 { margin: 0; font-size: 19px; font-weight: 700; }
.dhead span { font-size: 14px; color: var(--mute); }
.dhead .chg { color: var(--coral-ink); font-weight: 600; }
.intro { margin: 0 0 10px; color: var(--slate); font-size: 15px; }
.hrs { display: grid; gap: 6px; }
.hr { display: grid; grid-template-columns: 52px 1fr; align-items: start; gap: 8px; }
.hr > time { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; line-height: 52px; }
.hr.past > time { color: var(--mute); }
.tgs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tg { border-radius: 12px; border: 1.5px dashed rgba(22,58,85,.24); background: #fff; color: var(--mute); font-size: 15px; font-weight: 500; min-height: 52px;
  display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 8px; }
.tg[aria-pressed="true"] { border-style: solid; color: var(--navy); font-weight: 600; }
.tg.online[aria-pressed="true"] { background: var(--sky-on); border-color: var(--sky-on); }
.tg.osobne[aria-pressed="true"] { background: var(--peach-on); border-color: var(--peach-on); }
.tg .ck { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-grid; place-items: center; font-size: 11px; line-height: 1; flex: none; }
.tg[aria-pressed="true"] .ck { background: var(--navy); border-color: var(--navy); color: #fff; }
.tg.pend { box-shadow: 0 0 0 2px #fff inset, 0 0 0 4px var(--coral) inset; }
.tg:disabled { cursor: default; opacity: .45; }
/* a session: the client fills the hour (online navy, in person peach: owner, 16 Nov) */
.ses { border-radius: 14px; background: var(--navy); color: #fff; padding: 10px 12px; display: grid; gap: 8px; min-height: 52px; }
.ses.osobne { background: var(--peach-on); color: var(--navy); }
.ses .who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.ses .who b { font-size: 16px; }
.ses .who span { font-size: 14px; opacity: .85; }
.ses .tag { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; color: var(--navy); background: var(--sky-on); opacity: 1; }
.ses.osobne .tag { background: #fff; }
.ses .acts { display: flex; gap: 8px; }
.ses .acts > * { min-height: 40px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.4); background: transparent; color: inherit; font-weight: 600; font-size: 14px;
  padding: 0 14px; display: inline-flex; align-items: center; text-decoration: none; }
.ses .acts .pri { background: #fff; color: var(--navy); border-color: #fff; }
.ses.osobne .acts > * { border-color: rgba(22,58,85,.3); }
.ses.osobne .acts .pri { background: var(--navy); color: #fff; border-color: var(--navy); }
.ses .note { font-size: 13px; opacity: .85; }
/* busy in her Google calendar (a client booked there, her own event): no name, only that the hour is taken */
.cal { border-radius: 14px; background: var(--soft); color: var(--slate); padding: 7px 12px; min-height: 52px; display: grid; align-content: center; }
.cal b { font-size: 15px; font-weight: 600; color: var(--navy); line-height: 20px; }
.cal span { font-size: 13px; line-height: 18px; }
.past .cal b { color: var(--mute); }
.quick { display: flex; flex-wrap: wrap; gap: 0 20px; padding: 6px 0 0 60px; min-height: 46px; }
.link { background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 40px; font-weight: 500; font-size: 15px; text-align: left; }
.foot { margin: 24px 0 0; padding-top: 8px; border-top: 1px solid var(--line); display: grid; justify-items: start; }
.foot[hidden] { display: none; }
.devices summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 500; color: var(--slate); }
.devices ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.devices li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.devices li small { display: block; color: var(--mute); font-size: 13px; }

.login { max-width: 400px; margin: 48px auto 0; display: grid; gap: 14px; }
.login label { font-weight: 600; font-size: 15px; }
.login input { min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; padding: 0 16px; font: inherit; color: var(--navy); }
.login .b { width: 100%; min-height: 56px; font-size: 18px; }
.login p { margin: 0; color: var(--slate); }
.err { color: var(--coral-ink); font-weight: 500; }
.skel { height: 66px; border-radius: 12px; background: #EEF1F4; margin-top: 8px; }
.skel:first-child { margin-top: 0; }

/* the save bar floats over the page, so showing it never moves anything */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; align-items: center; gap: 8px; justify-content: flex-end;
  padding: 12px max(16px, env(safe-area-inset-right, 0px), calc(50vw - 320px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px), calc(50vw - 320px));
  background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(22,58,85,.1); transform: translateY(110%); visibility: hidden; }
.bar.show { transform: none; visibility: visible; }
.bar span { margin-right: auto; font-size: 15px; color: var(--slate); }
.bar b { color: var(--navy); }
.b { min-height: 48px; border: 0; border-radius: 999px; background: var(--coral); color: var(--navy); font-weight: 600; font-size: 16px; padding: 0 20px; cursor: pointer; }
.b.ghost { background: #fff; border: 1.5px solid var(--line); }
.b:disabled { opacity: .45; cursor: default; }

/* the move sheet */
.scrim { position: fixed; inset: 0; background: rgba(22,58,85,.35); z-index: 6; opacity: 0; visibility: hidden; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: #fff; border-radius: 20px 20px 0 0; max-height: 92vh; max-height: 92dvh; overflow: auto;
  overscroll-behavior: contain; padding: 16px max(16px, calc(50vw - 320px)) max(16px, env(safe-area-inset-bottom, 0px)); transform: translateY(105%); visibility: hidden; }
.mv.open .scrim { opacity: 1; visibility: visible; } .mv.open .sheet { transform: none; visibility: visible; }
.sheet h3 { margin: 0; font-size: 19px; }
.sheet .from { margin: 2px 0 12px; color: var(--mute); font-size: 15px; }
.mdays { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.mdays::-webkit-scrollbar { display: none; }
.mdays button { flex: none; width: 54px; min-height: 60px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; display: grid; justify-items: center; padding: 6px 0; font-variant-numeric: tabular-nums; }
.mdays button small { font-size: 12px; color: var(--mute); }
.mdays button b { font-size: 16px; }
.mdays button.closed { background: var(--soft); border-color: transparent; }
.mdays button[aria-pressed="true"] { border: 2px solid var(--navy); }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
.slot { min-height: 54px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; display: grid; place-items: center; align-content: center; padding: 4px 2px; font-variant-numeric: tabular-nums; }
.slot b { font-size: 15px; font-weight: 600; line-height: 20px; }
.slot small { font-size: 11px; line-height: 14px; color: var(--mute); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.slot.free.online { background: var(--sky); border-color: var(--sky); }
.slot.free.osobne { background: var(--peach); border-color: var(--peach); }
.slots .slot:disabled { background: var(--soft); border-color: transparent; color: var(--mute); cursor: default; }
.slot.cal { background: var(--soft); border: 1.5px dashed rgba(22,58,85,.3); }
.slot[aria-pressed="true"] { border: 2px solid var(--navy); box-shadow: 0 0 0 1px var(--navy) inset; }
.key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--slate); margin: 8px 0 0; }
.key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1.5px solid var(--line); }
.key i.f { background: var(--sky); border-color: var(--sky); } .osobne-key .key i.f { background: var(--peach); border-color: var(--peach); }
.key i.t { background: var(--soft); border-color: var(--soft); }
.key i.c { background: var(--soft); border: 1.5px dashed rgba(22,58,85,.3); }
.warn { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--peach); font-size: 14px; min-height: 0; }
.warn[hidden] { display: none; }
.warn.err { background: #FBE3DC; }
.go { display: grid; gap: 8px; margin-top: 14px; }
.go .b { width: 100%; }
.go p { margin: 0; font-size: 13px; color: var(--mute); text-align: center; }
.go .link { justify-self: center; }

/* "Uloženo" lives in its own fixed layer: it never moves anything */
.toast { position: fixed; z-index: 8; left: 50%; bottom: max(84px, calc(env(safe-area-inset-bottom, 0px) + 72px)); transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  background: var(--navy); color: #fff; border-radius: 999px; padding: 10px 18px; font-size: 15px; font-weight: 500; width: max-content; max-width: calc(100vw - 32px); text-align: center; box-shadow: 0 8px 24px rgba(22,58,85,.2); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: no-preference) {
  .bar, .sheet { transition: transform .22s, visibility .22s; } .scrim { transition: opacity .2s, visibility .2s; }
  .toast { transition: opacity .2s, transform .2s; } .tg { transition: background-color .12s, border-color .12s; }
}
</style>
<body>
<div class="wrap">
  <header class="top">
    <div class="row"><h1 id="title">Moje hodiny</h1>
      <div class="mon" id="tools" hidden>
        <button class="nav" id="prev">‹</button><button class="monbtn" id="monbtn" aria-expanded="false"></button><button class="nav" id="next">›</button>
      </div>
      <button class="back" id="back" hidden>Zpět na kalendář</button>
    </div>
    <div class="month" id="month" hidden></div>
    <div class="strip" id="strip" role="group" aria-label="Dny"></div>
  </header>
  <main id="list" aria-live="off"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
  <div class="foot" id="foot" hidden>
    <button class="link" id="regular">Běžný týden: hodiny, ze kterých dny vycházejí</button>
    <details class="devices" id="devices" hidden><summary>Přihlášená zařízení</summary><ul id="devList"></ul></details>
  </div>
</div>
<div class="bar" id="bar" aria-hidden="true"><span><b id="barN"></b> neuloženo</span>
  <button class="b ghost" id="discard" tabindex="-1">Zahodit</button><button class="b" id="save" tabindex="-1">Uložit</button></div>
<div class="mv" id="mv"><div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="mvT">
    <h3 id="mvT">Přesunout sezení</h3>
    <p class="from" id="mvFrom"></p>
    <div class="mdays" id="mvDays" role="group" aria-label="Den"></div>
    <div class="slots" id="mvSlots" role="group" aria-label="Čas"></div>
    <div class="key" aria-hidden="true"><span><i class="f"></i>tvoje hodiny</span><span><i></i>mimo hodiny, jde taky</span><span><i class="c"></i>v kalendáři</span><span><i class="t"></i>obsazeno</span></div>
    <p class="warn" id="mvWarn" role="status" hidden></p>
    <div class="go"><button class="b" id="mvGo" disabled>Vyber nový čas</button>
      <p id="mvNote"></p>
      <button class="link" id="mvX">Zpět</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var DAYS = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'], SH = ['Ne', 'Po', 'Út', 'St', 'Čt', 'Pá', 'So'];
  var MONTHS = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
  var MONTHS_1 = ['Leden', 'Únor', 'Březen', 'Duben', 'Květen', 'Červen', 'Červenec', 'Srpen', 'Září', 'Říjen', 'Listopad', 'Prosinec'];
  var F = ['online', 'osobne'], FN = { online: 'Online', osobne: 'Osobně' };
  var MOVE_FIRST = 7, MOVE_LAST = 20;   // booking.php OWNER_MOVE_FIRST / LAST
  var HOURS = [], HOLIDAYS = {}, MIN_NOTICE_H = 24;
  var week = { online: {}, osobne: {} }, over = { online: {}, osobne: {} }, booked = {};
  var cal = {}, calOk = true;   // hours busy in her Google calendar ('Y-m-d' -> {hour: 1}); calOk false: Google not read
  var savedWeek, savedOver, version = 0, now, today0, last, saving = false;
  var state = { sel: null, wk: null, month: false, my: null, reg: false, wd: 1 };
  var wideMq = matchMedia('(min-width: 900px)');
  function monthOpen() { return state.month || wideMq.matches; }   // on a computer the month is always open

  var $ = function (id) { return document.getElementById(id); };
  var bar = $('bar'), barN = $('barN'), list = $('list'), toastEl = $('toast'), toastT;
  function pad(n) { return ('0' + n).slice(-2); }
  function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function monday(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
  function dateOf(k) { return new Date(k + 'T12:00'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function plural(n, a, b, c) { return n + ' ' + (n === 1 ? a : n > 1 && n < 5 ? b : c); }
  function toast(t, long) {
    toastEl.textContent = t; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('show'); }, long ? 4500 : 1800);
  }
  function call(url, body) {
    return fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' } : { credentials: 'same-origin' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; if (!r.ok && r.status !== 401) { var e = new Error(j.error || 'Chyba ' + r.status); e.status = r.status; throw e; } return j; }); });
  }
  function api(path, body) { return call('/api/hodiny' + path, body); }

  // a holiday starts closed, but she can still open hours on it by hand
  function base(f, k, w) { return HOLIDAYS[k] ? [] : w[f][dateOf(k).getDay()] || []; }

    api('/odhlasit', { id: t.dataset.out }).then(function (j) {
      if (me || j._status === 401) { savedWeek = null; showLogin('Odhlášeno.'); return; }
      renderDevices(j.devices); toast('Zařízení odhlášeno');
    }).catch(function (err) { toast(err.message, true); });
  });

  function showLogin(msg) {
    $('tools').hidden = true; $('back').hidden = true; $('foot').hidden = true; $('month').hidden = true;
    $('strip').innerHTML = ''; $('title').textContent = 'Moje hodiny';
    bar.classList.remove('show');
    // a username field the password manager can remember next to the password (the same for everyone)
    list.innerHTML = '<form class="login" id="login"><p>' + esc(msg || 'Zadej heslo. Toto zařízení si ho pak rok pamatuje.') + '</p>' +
      '<input type="text" name="username" value="hodiny" autocomplete="username" hidden>' +
      '<label for="pw">Heslo</label><input id="pw" type="password" autocomplete="current-password" required>' +
      '<p class="err" id="loginErr" role="alert"></p><button class="b" type="submit">Přihlásit</button></form>';
    var form = $('login');
    $('pw').focus();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = form.querySelector('button'), err = $('loginErr');
      btn.disabled = true; err.textContent = '';
      api('/prihlasit', { heslo: $('pw').value }).then(function (j) {
        if (j._status === 401) throw new Error(j.error || 'Špatné heslo.');
        load(true);
      }).catch(function (x) { err.textContent = x.message; btn.disabled = false; $('pw').select(); });
    });
  }

  function load(keepDraft, then) {
    api('').then(function (j) {
      if (j._status === 401) { showLogin(); return; }
      HOURS = []; for (var h = j.first_hour; h <= j.last_hour; h++) HOURS.push(h);
      HOLIDAYS = j.holidays || {}; MIN_NOTICE_H = j.min_notice_hours; booked = j.booked || {};
      calOk = !!j.cal; cal = j.cal || {};
      version = j.version;
      // keepDraft: only this device's own unsaved changes go on top of what the server has now
      var mine = keepDraft && savedWeek && changes() ? payload() : null, oldWeek = savedWeek;
      savedWeek = { online: Object.assign({}, j.week.online), osobne: Object.assign({}, j.week.osobne) };
      savedOver = { online: Object.assign({}, j.days.online), osobne: Object.assign({}, j.days.osobne) };
      week = clone(savedWeek); over = clone(savedOver);
      if (mine) F.forEach(function (f) {
        for (var wd = 0; wd < 7; wd++) if (!same(mine.week[f][wd], oldWeek[f][wd])) week[f][wd] = (mine.week[f][wd] || []).slice();
        Object.keys(mine.days[f]).forEach(function (k) { if (mine.days[f][k] === null) delete over[f][k]; else over[f][k] = mine.days[f][k].slice(); });
      });
      now = new Date();
      today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      last = dateOf(j.to);
      if (!state.sel) {
        // after her last hour today, tomorrow comes first
        var first = new Date(today0.getFullYear(), today0.getMonth(), today0.getDate(), HOURS[HOURS.length - 1] + 1) <= now ? addDays(today0, 1) : today0;
        select(key(first));
      }
      if (dateOf(state.sel) < today0) select(key(today0));
      $('tools').hidden = state.reg;
      renderDevices(j.devices || []);
      render();
      if (then) then();
    }).catch(function (err) {
      list.innerHTML = '<p class="intro err">Hodiny se nepodařilo načíst (' + esc(err.message) + '). Zkus stránku obnovit.</p>';
    });
  }
  load(false);
})();
</script>
</body></html>
